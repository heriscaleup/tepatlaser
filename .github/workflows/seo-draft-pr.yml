name: SEO Draft PR Gate

on:
  push:
    branches:
      - 'seo/agent/**'

concurrency:
  group: seo-draft-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  validate-and-open-draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Enforce SEO executor path boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          base_sha="$(git merge-base origin/main HEAD)"
          changed_files="$(git diff --name-only "$base_sha" HEAD)"
          [ -n "$changed_files" ]
          if printf '%s\n' "$changed_files" | grep -Ev '^src/content/blog/[^/]+\.mdx?$'; then
            echo "::error::SEO executor may change only Markdown files directly under src/content/blog/."
            exit 1
          fi

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run unit tests
        run: npm test

      - name: Validate Astro content schema
        run: npm run check

      - name: Build candidate and capture quality report
        shell: bash
        run: |
          npm run build
          set +e
          VERIFY_REPORT_PATH="$RUNNER_TEMP/candidate-report.json" npm run verify
          verify_status=$?
          set -e
          test -s "$RUNNER_TEMP/candidate-report.json"
          echo "Candidate verifier exit: $verify_status (baseline debt is compared next)"

      - name: Build main baseline and reject new regressions
        shell: bash
        run: |
          git worktree add "$RUNNER_TEMP/tepatlaser-main" origin/main
          cd "$RUNNER_TEMP/tepatlaser-main"
          npm ci --legacy-peer-deps
          npm run build
          set +e
          VERIFY_REPORT_PATH="$RUNNER_TEMP/baseline-report.json" npm run verify
          baseline_status=$?
          set -e
          test -s "$RUNNER_TEMP/baseline-report.json"
          echo "Baseline verifier exit: $baseline_status (existing debt stays explicit)"
          cd "$GITHUB_WORKSPACE"
          node scripts/verify-no-regression.mjs \
            "$RUNNER_TEMP/baseline-report.json" \
            "$RUNNER_TEMP/candidate-report.json"

      - name: Create Draft Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          existing_url="$(gh pr list --head "$GITHUB_REF_NAME" --base main --json url --jq '.[0].url // empty')"
          if [ -n "$existing_url" ]; then
            echo "Draft PR already exists: $existing_url"
            exit 0
          fi
          gh pr create \
            --draft \
            --base main \
            --head "$GITHUB_REF_NAME" \
            --title "seo: review agent-generated content (${GITHUB_REF_NAME##*/})" \
            --body "Automated SEO draft generated by Agent Office HQ. Tests, Astro schema checks, production build, sitemap generation, and the no-new-regression verification gate passed before this Draft PR was opened. Existing baseline verification debt remains visible in the workflow log. Merge remains manual."
