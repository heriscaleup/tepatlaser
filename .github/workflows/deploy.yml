# Nama workflow yang akan muncul di tab Actions di GitHub
name: Deploy Astro to Hostinger FTP

concurrency:
  group: tepatlaser-production
  cancel-in-progress: true

# Kapan workflow ini dijalankan
on:
  # Dijalankan setiap kali ada push ke branch 'main'
  push:
    branches: ["main"]
  # Bisa juga dijalankan manual dari tab Actions
  workflow_dispatch:

# Langkah-langkah yang akan dijalankan
jobs:
  # Nama job-nya
  build-and-deploy:
    runs-on: ubuntu-latest # Menjalankan job di mesin virtual Ubuntu
    steps:
      # 1. Mengambil kode dari repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22" # Versi Node.js yang direkomendasikan untuk Astro V6
          cache: 'npm'

      # 3. Install semua dependencies
      - name: Install Dependencies
        run: npm ci --legacy-peer-deps

      # 4. Build project Astro jadi file statis di folder 'dist'
      - name: Build Astro Project
        run: npm run build

      # 5. Ambil versi release dari build output untuk dipakai di step verifikasi
      - name: Read release version
        id: release
        run: |
          RELEASE=$(cat dist/release.json | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('release') or d.get('version', 'v7-2026-07-24'))")
          echo "version=$RELEASE" >> $GITHUB_OUTPUT
          echo "Release version: $RELEASE"

      # 6. Deploy ke Hostinger via FTP
      - name: Fast Deploy to Dewaweb public_html
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 103.185.53.100
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
          state-name: .ftp-deploy-sync-state-v1.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # 7. Purge Cloudflare cache otomatis setelah FTP upload selesai
      - name: Purge Cloudflare Cache
        shell: bash
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
        run: |
          echo "Purging Cloudflare cache for zone $CF_ZONE_ID..."
          RESPONSE=$(curl -s -o /tmp/cf_purge_response.json -w "%{http_code}" \
            -X POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/purge_cache" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')

          cat /tmp/cf_purge_response.json

          if [ "$RESPONSE" = "200" ]; then
            SUCCESS=$(cat /tmp/cf_purge_response.json | python3 -c "import sys,json; print(json.load(sys.stdin).get('success', False))")
            if [ "$SUCCESS" = "True" ]; then
              echo "✅ Cloudflare cache purged successfully."
            else
              echo "⚠️ CF API returned 200 but success=false. Check token permissions."
              exit 1
            fi
          else
            echo "❌ CF API returned HTTP $RESPONSE. Purge failed."
            exit 1
          fi

      # 8. Verifikasi halaman dan aset penting di origin hosting.
      # GitHub-hosted runner dapat terkena 403 di edge/CDN, jadi cek origin Dewaweb langsung
      # memakai IP deploy yang sama untuk membuktikan file FTP benar-benar sudah terpublikasi.
      - name: Verify public blog assets
        shell: bash
        run: |
          ORIGIN_IP="103.185.53.100"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126 Safari/537.36"
          BLOG_IMAGES=(
            "https://tepatlaser.com/images/blog/kenapa-presisi-laser-cutting-penting-industri-manufaktur.webp"
            "https://tepatlaser.com/images/blog/tips-audit-kualitas-hasil-laser-cutting.webp"
            "https://tepatlaser.com/images/blog/studi-kasus-custom-part-industri-berat-2026-07.webp"
          )

          echo "Waiting for origin /blog/ and critical blog thumbnails..."
          for attempt in {1..6}; do
            BLOG_STATUS=$(curl -A "$UA" --resolve "tepatlaser.com:443:${ORIGIN_IP}" -sS -L -o /tmp/blog.html -w "%{http_code}" "https://tepatlaser.com/blog/?bust=${GITHUB_SHA}-${attempt}" || echo "0")
            echo "Attempt $attempt: origin /blog/ status='$BLOG_STATUS'"

            if [ "$BLOG_STATUS" = "200" ]; then
              ALL_IMAGES_OK=true
              for image_url in "${BLOG_IMAGES[@]}"; do
                HEADERS_FILE="/tmp/$(basename "$image_url").headers"
                HTTP_CODE=$(curl -A "$UA" --resolve "tepatlaser.com:443:${ORIGIN_IP}" -sS -L -o /dev/null -D "$HEADERS_FILE" -w "%{http_code}" "${image_url}?bust=${GITHUB_SHA}-${attempt}" || echo "0")
                CONTENT_TYPE=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {print $2; exit}' "$HEADERS_FILE" | tr -d '\r')
                echo "Attempt $attempt: origin $image_url status='$HTTP_CODE' content-type='$CONTENT_TYPE'"

                if [ "$HTTP_CODE" != "200" ] || [[ "$CONTENT_TYPE" != image/webp* ]]; then
                  ALL_IMAGES_OK=false
                fi
              done

              if [ "$ALL_IMAGES_OK" = "true" ]; then
                echo "✅ Origin blog page and critical thumbnails are live with image/webp responses."
                exit 0
              fi
            fi

            sleep 5
          done

          echo "❌ Origin blog page or critical thumbnail verification failed."
          exit 1
